name: Update Satellite Data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Crear carpeta
        run: mkdir -p tle

      - name: Descargar datos de CelesTrak
        run: |
          curl -fLs "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json" -o tle/active.json
          curl -fLs "https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=json" -o tle/starlink-supplemental.json
          curl -fLs "https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=json" -o tle/visual.json

      - name: Commit cambios
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add tle/*.json

          git commit -m "update satellite data" || echo "sin cambios"

          git pull --rebase origin main
          git push
