
name: Update Pre-Launches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prelaunches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener Pre-Launches y respaldos de CelesTrak
        run: |
          cat << 'EOF' > fetch_prelaunches.js
          const fs = require('fs');

          const INDEX_URL =
            'https://celestrak.org/NORAD/elements/supplemental/index.php';

          const DATA_URL =
            'https://celestrak.org/NORAD/elements/supplemental/sup-gp.php';

          const MAX_BACKUPS = 10;

          function decodeEntities(text) {
            return text
              .replace(/&nbsp;|&#160;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/&#(\d+);/g, (_, n) =>
                String.fromCodePoint(Number(n))
              )
              .replace(/&#x([0-9a-f]+);/gi, (_, n) =>
                String.fromCodePoint(parseInt(n, 16))
              );
          }

          function htmlToText(html) {
            return decodeEntities(
              html
                .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
                .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
                .replace(/<!--[\s\S]*?-->/g, ' ')
                .replace(/<br\b[^>]*>/gi, '\n')
                .replace(/<\/(?:p|div|h[1-6]|li|tr|section|article)>/gi, '\n')
                .replace(/<[^>]*>/g, ' ')
            )
              .replace(/\r/g, '')
              .replace(/[ \t]+/g, ' ')
              .replace(/ *\n */g, '\n')
              .replace(/\n{2,}/g, '\n')
              .trim();
          }

          function cleanName(name) {
            return decodeEntities(name)
              .replace(/<[^>]*>/g, '')
              .replace(/\s+/g, ' ')
              .replace(/pre[\s-]?launch/gi, '')
              .trim();
          }

          function makeFileId(name) {
            return cleanName(name)
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
          }

          function normalize(name) {
            return String(name || '')
              .toLowerCase()
              .replace(/pre[\s-]?launch/gi, '')
              .replace(/group/g, 'g')
              .replace(/[^a-z0-9]/g, '');
          }

          function extractDatasets(html) {
            const result = [];
            const anchorRegex = /<a\b[^>]*>([\s\S]*?)<\/a>/gi;
            let match;

            while ((match = anchorRegex.exec(html)) !== null) {
              const anchorText = htmlToText(match[1]);

              if (!/pre[\s-]?launch/i.test(anchorText)) {
                continue;
              }

              const name = cleanName(anchorText);
              const fileId = makeFileId(name);

              if (!name || !fileId) continue;

              if (result.some(item => item.fileId === fileId)) {
                continue;
              }

              result.push({
                name,
                anchorText,
                fileId
              });
            }

            return result;
          }

          function parseUtcDate(text, label) {
            const regex = new RegExp(
              label +
              String.raw`\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}(?:\.\d+)?)\s*UTC`,
              'i'
            );

            const match = text.match(regex);
            if (!match) return null;

            const value = match[1].replace(/\s+/, 'T') + 'Z';
            const date = new Date(value);

            return Number.isNaN(date.getTime())
              ? null
              : date.toISOString();
          }

          function parseSchedule(text) {
            const launchWindowMatch = text.match(
              /Launch window:\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}(?:\.\d+)?)\s*UTC\s*to\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}(?:\.\d+)?)\s*UTC/i
            );

            let launchWindow = null;

            if (launchWindowMatch) {
              const start = new Date(
                launchWindowMatch[1].replace(/\s+/, 'T') + 'Z'
              );
              const end = new Date(
                launchWindowMatch[2].replace(/\s+/, 'T') + 'Z'
              );

              if (
                !Number.isNaN(start.getTime()) &&
                !Number.isNaN(end.getTime())
              ) {
                launchWindow = {
                  start: start.toISOString(),
                  end: end.toISOString()
                };
              }
            }

            return {
              launch: parseUtcDate(text, 'Launch:'),
              deploy: parseUtcDate(text, 'Deploy:'),
              launch_window: launchWindow
            };
          }

          async function fetchText(url) {
            const response = await fetch(url, {
              signal: AbortSignal.timeout(25000),
              headers: {
                'User-Agent': 'SatargExplorer-PrelaunchUpdater/1.0'
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${url}`);
            }

            return response.text();
          }

          async function fetchDataset(fileId) {
            const url =
              `${DATA_URL}?FILE=${encodeURIComponent(fileId)}&FORMAT=JSON`;

            let lastError;

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(url, {
                  signal: AbortSignal.timeout(25000),
                  headers: {
                    'User-Agent': 'SatargExplorer-PrelaunchUpdater/1.0'
                  }
                });

                if (!response.ok) {
                  throw new Error(`HTTP ${response.status}`);
                }

                const json = await response.json();

                if (!Array.isArray(json) || json.length === 0) {
                  throw new Error('La respuesta no contiene un array con datos');
                }

                // Mantiene la lógica original de Satarg:
                // prioriza SINGLE y elimina STACK/DEPLOY.
                const filtered = json.filter(item => {
                  const objectName = String(item.OBJECT_NAME || '').toUpperCase();

                  return objectName.includes('SINGLE') ||
                    (!objectName.includes('STACK') &&
                     !objectName.includes('DEPLOY'));
                });

                return filtered.length > 0 ? filtered : json;
              } catch (error) {
                lastError = error;
                console.warn(
                  `Intento ${attempt}/3 fallido para ${fileId}: ${error.message}`
                );

                if (attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, 1500));
                }
              }
            }

            throw new Error(
              `No se pudo descargar ${fileId}: ${lastError?.message}`
            );
          }

          function matchLaunch(datasetName, launches) {
            const target = normalize(datasetName);
            if (!target) return null;

            // Primero busca coincidencias de misión completas.
            const matches = launches
              .map(launch => ({
                launch,
                name: normalize(launch.name)
              }))
              .filter(item =>
                item.name &&
                (item.name.includes(target) || target.includes(item.name))
              )
              .sort((a, b) => b.name.length - a.name.length);

            return matches[0]?.launch || null;
          }

          async function run() {
            const outputPath = 'launches/prelaunches.json';

            console.log('Leyendo lanzamientos de Launch Library 2...');
            const ll2Data = JSON.parse(
              fs.readFileSync('launches/next-launches.json', 'utf8')
            );

            const launches = Array.isArray(ll2Data.results)
              ? ll2Data.results
              : [];

            console.log('Descargando índice de CelesTrak una sola vez...');
            const html = await fetchText(INDEX_URL);
            const plainText = htmlToText(html);
            const datasets = extractDatasets(html);

            console.log(
              `Misiones principales detectadas: ${datasets.length}`
            );

            // Protección crítica: nunca borrar datos válidos por un
            // problema de detección del HTML.
            if (datasets.length === 0) {
              throw new Error(
                'No se detectaron misiones principales. ' +
                'Se conserva el JSON anterior sin modificar.'
              );
            }

            let finalPrelaunches = [];
            let backupCount = 0;
            let backupFailures = 0;

            for (let i = 0; i < datasets.length; i++) {
              const dataset = datasets[i];
              const nextDataset = datasets[i + 1];

              // Aísla el bloque de texto de esta misión hasta la siguiente.
              let start = plainText.indexOf(dataset.anchorText);

              if (start === -1) {
                start = plainText.indexOf(
                  `${dataset.name} Pre-Launch`
                );
              }

              if (start === -1) {
                throw new Error(
                  `No se pudo ubicar la sección de ${dataset.name}. ` +
                  'Se conserva el JSON anterior.'
                );
              }

              let end = nextDataset
                ? plainText.indexOf(nextDataset.anchorText, start + 1)
                : -1;

              if (end === -1) end = plainText.length;

              const section = plainText.slice(start, end);
              const firstBackupIndex = section.search(
                /Backup Launch Opportunity\s*#\s*\d+/i
              );

              const mainSection = firstBackupIndex >= 0
                ? section.slice(0, firstBackupIndex)
                : section;

              const schedule = parseSchedule(mainSection);
              const matchedLL2 = matchLaunch(dataset.name, launches);

              console.log(
                `Procesando ${dataset.name} | FILE=${dataset.fileId} | ` +
                `LL2=${matchedLL2 ? matchedLL2.name : 'sin coincidencia'}`
              );

              // La misión principal es obligatoria. Si falla, no se
              // publica una actualización parcial que pueda perder datos.
              const mainData = await fetchDataset(dataset.fileId);

              const backups = [];
              const backupRegex =
                /Backup Launch Opportunity\s*#\s*(\d+)/gi;

              const backupMatches = [...section.matchAll(backupRegex)]
                .map(match => ({
                  number: Number(match[1]),
                  index: match.index
                }))
                .filter(item =>
                  item.number >= 1 &&
                  item.number <= MAX_BACKUPS
                );

              console.log(
                `  Respaldos publicados: ${backupMatches.length}`
              );

              for (let b = 0; b < backupMatches.length; b++) {
                const backup = backupMatches[b];
                const nextBackup = backupMatches[b + 1];

                const backupSection = section.slice(
                  backup.index,
                  nextBackup ? nextBackup.index : section.length
                );

                const backupFileId =
                  `${dataset.fileId}b${backup.number}`;

                try {
                  const backupData = await fetchDataset(backupFileId);
                  const backupSchedule = parseSchedule(backupSection);

                  backups.push({
                    backup_number: backup.number,
                    celestrak_name:
                      `${dataset.name} - Backup #${backup.number}`,
                    celestrak_file: backupFileId,
                    launch: backupSchedule.launch,
                    deploy: backupSchedule.deploy,
                    launch_window: backupSchedule.launch_window,
                    data: backupData
                  });

                  backupCount++;

                  console.log(
                    `    OK ${backupFileId}` +
                    (backupSchedule.launch
                      ? ` | Launch: ${backupSchedule.launch}`
                      : '')
                  );
                } catch (error) {
                  backupFailures++;

                  console.warn(
                    `    Respaldo omitido ${backupFileId}: ${error.message}`
                  );
                }
              }

              finalPrelaunches.push({
                celestrak_name: dataset.name,
                celestrak_file: dataset.fileId,
                is_matched_with_ll2: !!matchedLL2,
                launch_id: matchedLL2 ? matchedLL2.id : null,
                launch_name_ll2: matchedLL2 ? matchedLL2.name : null,

                // Horario real publicado por CelesTrak, con LL2 como respaldo.
                net: schedule.launch || (matchedLL2 ? matchedLL2.net : null),

                launch: schedule.launch,
                deploy: schedule.deploy,
                launch_window: schedule.launch_window,

                data: mainData,
                backups
              });
            }

            if (finalPrelaunches.length === 0) {
              throw new Error(
                'No se generaron misiones. Se conserva el JSON anterior.'
              );
            }

            fs.mkdirSync('launches', { recursive: true });

            const newContent =
              JSON.stringify(finalPrelaunches, null, 2) + '\n';

            // Escribir solo después de completar todas las misiones principales.
            fs.writeFileSync(outputPath, newContent);

            console.log('----------------------------------------');
            console.log(`Misiones guardadas: ${finalPrelaunches.length}`);
            console.log(`Respaldos guardados: ${backupCount}`);
            console.log(`Respaldos fallidos: ${backupFailures}`);
            console.log(`Archivo actualizado: ${outputPath}`);
          }

          run().catch(error => {
            console.error('ERROR FATAL:', error.message);
            process.exit(1);
          });
          EOF

          node fetch_prelaunches.js

      - name: Commit cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add launches/prelaunches.json

          if git diff --cached --quiet; then
            echo "Sin cambios en prelaunches.json"
          else
            git commit -m "update pre-launches data"
            git push
          fi
