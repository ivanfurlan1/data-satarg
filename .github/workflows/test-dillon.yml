name: Update Dillon PreTLE

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-dillon-pretle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Read Dillon PreTLE
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            console.log('Opening Dillon PreTLE page...');

            await page.goto('https://dillonsspacepage.com/pretle', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log('Waiting for Dillon data...');

            await page.waitForFunction(() => {
              const text = document.body.innerText || '';
              return (
                text.includes('UPCOMING MISSIONS') &&
                !text.includes('No Upcoming Missions')
              );
            }, {
              timeout: 60000
            });

            console.log('Upcoming missions detected.');

            await page.waitForTimeout(3000);

            const html = await page.content();

            fs.writeFileSync(
              'dillon-rendered.html',
              html,
              'utf8'
            );

            const text = await page.locator('body').innerText();

            fs.writeFileSync(
              'dillon-pretle.txt',
              text,
              'utf8'
            );

            console.log('Dillon data saved.');
            console.log(text);

            await browser.close();
          })();
          EOF

      - name: Upload Dillon data
        uses: actions/upload-artifact@v4
        with:
          name: dillon-pretle
          path: |
            dillon-rendered.html
            dillon-pretle.txt
