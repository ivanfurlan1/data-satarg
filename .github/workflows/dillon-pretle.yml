name: Update Dillon PreTLE

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dillon-pretle:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Descargar el repositorio
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Instalar Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------------------------------
      # 3. Instalar Playwright + Chromium
      # ---------------------------------------------------------
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # ---------------------------------------------------------
      # 4. Abrir Dillon y obtener los PreTLE
      # ---------------------------------------------------------
      - name: Read Dillon PreTLE
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            console.log('Opening Dillon PreTLE...');

            await page.goto('https://dillonsspacepage.com/pretle', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log('Waiting for Dillon data...');

            await page.waitForFunction(() => {

              const text = document.body.innerText || '';

              return (
                text.includes('UPCOMING MISSIONS') &&
                /(?:^|\n)1\s+\d{5}[A-Z]\s+/m.test(text) &&
                /(?:^|\n)2\s+\d{5}\s+/m.test(text)
              );

            }, {
              timeout: 60000
            });

            console.log('TLE data detected.');

            // Pequeña espera para asegurarnos de que terminó
            // de renderizar todo el contenido.
            await page.waitForTimeout(3000);

            const text = await page.locator('body').innerText();

            await browser.close();

            // ---------------------------------------------------
            // Parsear los datos
            // ---------------------------------------------------

            const lines = text
              .split('\n')
              .map(line => line.trim())
              .filter(Boolean);

            const missions = [];

            let currentMission = null;

            for (let i = 0; i < lines.length; i++) {

              const line = lines[i];

              // Ejemplo:
              // Crew-13NET: Oct 01 2026 15:10:06 UTC
              const missionHeader = line.match(
                /^(.+?)NET:\s*(.+?)\s+UTC$/i
              );

              if (missionHeader) {

                currentMission = {
                  mission: missionHeader[1].trim(),
                  launch: missionHeader[2].trim() + ' UTC'
                };

                continue;
              }

              // TLE Line 1
              if (/^1\s+\d{5}[A-Z]\s+/.test(line)) {

                const tle1 = line;

                const nextLine = lines[i + 1];

                // TLE Line 2
                if (nextLine && /^2\s+\d{5}\s+/.test(nextLine)) {

                  const tle2 = nextLine;

                  // El nombre de la entrada está normalmente
                  // inmediatamente antes de la línea 1.
                  const name = i > 0 ? lines[i - 1] : '';

                  missions.push({
                    mission: currentMission
                      ? currentMission.mission
                      : null,

                    launch: currentMission
                      ? currentMission.launch
                      : null,

                    name: name,

                    tle1: tle1,
                    tle2: tle2
                  });

                  i++;
                }
              }
            }

            // ---------------------------------------------------
            // Crear JSON final
            // ---------------------------------------------------

            const output = {
              source: 'Dillon Space Page',
              sourceUrl: 'https://dillonsspacepage.com/pretle',
              updatedAt: new Date().toISOString(),
              missions: missions
            };

            fs.mkdirSync('launches', {
              recursive: true
            });

            fs.writeFileSync(
              'launches/dillon-pretle.json',
              JSON.stringify(output, null, 2) + '\n',
              'utf8'
            );

            console.log(
              `Saved ${missions.length} TLE entries.`
            );

            console.log(
              JSON.stringify(output, null, 2)
            );

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });
          EOF

      # ---------------------------------------------------------
      # 5. Comprobar si cambió el archivo
      # ---------------------------------------------------------
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- launches/dillon-pretle.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ---------------------------------------------------------
      # 6. Guardar el archivo en GitHub
      # ---------------------------------------------------------
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add launches/dillon-pretle.json

          git commit -m "Update Dillon PreTLE data"

          git push
