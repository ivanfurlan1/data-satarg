name: Test Dillon PreTLE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-dillon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Read Dillon
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            await page.goto('https://dillonsspacepage.com/pretle', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            await page.waitForTimeout(5000);

            const text = await page.locator('body').innerText();

            fs.writeFileSync(
              'dillon-debug.txt',
              text
            );

            console.log(text);

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Save debug file
        run: |
          git add -f dillon-debug.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Debug Dillon PreTLE"
          git push

